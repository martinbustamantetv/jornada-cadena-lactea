<style>
@font-face{font-family:'Pliant';
  src:url('assets/fonts/Pliant-ThinItalic.woff2') format('woff2'),
      url('assets/fonts/Pliant-ThinItalic.ttf') format('truetype');

@font-face{font-family:'Pliant';

@font-face{font-family:'Pliant';

@font-face{font-family:'Pliant';

      url('assets/fonts/Pliant-Black.ttf') format('truetype');

:root{
  --azul:#0752A9;--celeste:#73C1EF;--verde:#80B133;--noche:#02142C;--noche-2:#041F42;
  --display:'Pliant','Archivo',system-ui,sans-serif;
  --texto:'Inter',system-ui,-apple-system,sans-serif;
  --pad:clamp(20px,5vw,80px);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;min-height:100svh;background:var(--noche);color:#fff;
  font-family:var(--texto);font-size:clamp(16px,1.05vw,18px);line-height:1.6;
  display:flex;flex-direction:column;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--verde);outline-offset:3px;border-radius:2px}

/* ── barra superior ── */
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:16px var(--pad);border-bottom:1px solid rgba(255,255,255,.09)}
.top img{height:32px;width:auto}
.volver{display:inline-flex;align-items:center;gap:9px;
  font-family:var(--texto);font-weight:500;text-transform:uppercase;font-size:11px;letter-spacing:.16em;
  color:rgba(255,255,255,.68);transition:color .3s}
.volver:hover{color:var(--celeste)}
.volver svg{width:14px;height:14px}

/* ── aviso central ── */
.esc{flex:1;position:relative;display:grid;place-items:center;
  padding:clamp(60px,10vw,120px) var(--pad);overflow:hidden;isolation:isolate}
.esc canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:.6;pointer-events:none}
.caja{position:relative;z-index:2;text-align:center;max-width:600px}
.marca{width:min(260px,58vw);margin:0 auto clamp(28px,4vw,44px)}
.d{font-family:var(--display);font-style:italic;text-transform:uppercase;margin:0;line-height:.94}
.t1{display:block;font-weight:100;font-style:normal;font-size:clamp(1.1rem,2.4vw,1.7rem);letter-spacing:.14em;color:var(--celeste)}
.t2{display:block;font-weight:900;font-size:clamp(2.1rem,6vw,4.2rem);letter-spacing:-.035em;
  margin-top:6px}
.aviso{margin:clamp(22px,3vw,32px) auto 0;max-width:44ch;font-size:clamp(.98rem,1.2vw,1.1rem);
  color:rgba(255,255,255,.78);line-height:1.6}
.aviso b{color:#fff;font-weight:600}

.redes{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;
  margin-top:clamp(28px,3.6vw,42px)}
.redes a{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;
  border:1px solid rgba(255,255,255,.24);color:rgba(255,255,255,.86);
  font-family:var(--texto);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.13em;
  transition:background .3s,color .3s,border-color .3s,transform .4s var(--ease)}
.redes a:hover{background:var(--celeste);border-color:var(--celeste);color:var(--noche);transform:translateY(-3px)}
.redes svg{width:16px;height:16px;flex:none}

/* ── pie ── */
.pie{padding:clamp(26px,3vw,40px) var(--pad);border-top:1px solid rgba(255,255,255,.09);
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px}
.pie span{font-size:.8rem;color:rgba(255,255,255,.42)}
.pie .orgs{display:flex;align-items:center;gap:clamp(20px,3vw,40px)}
.pie .orgs img{width:clamp(120px,13vw,160px);height:auto;opacity:.75;transition:opacity .3s}
.pie .orgs a:hover img{opacity:1}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <a href="index.html" aria-label="Jornada de la Cadena Láctea de Entre Ríos">
    <img src="assets/logo-vaca.png" alt="">
  </a>
  <a class="volver" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    Volver al sitio
  </a>
</header>

<main class="esc">
  <canvas id="particulas" aria-hidden="true"></canvas>
  <div class="caja">
    <img class="marca" src="assets/logo-blanco.png" alt="Jornada de la Cadena Láctea de Entre Ríos">
    <h1 class="d">
      <span class="t1">Galería</span>
      <span class="t2">En construcción</span>
    </h1>
    <p class="aviso">
      Esta parte aún está en construcción. <b>Seguinos en nuestras redes</b> para tener las últimas
      novedades acerca del evento.
    </p>

    
    <nav class="redes">
      <a href="https://www.instagram.com/martinbustamantetv/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>
        Instagram
      </a>
      <a href="https://www.facebook.com/MBustamante.Tv/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M14.9 8.4h-1.3c-1 0-1.7.7-1.7 1.7v1.7m-1.4 0h4.2m-2.8 0v6.4"/></svg>
        Facebook

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.4 2.6 3.6 5.6 3.6 9s-1.2 6.4-3.6 9c-2.4-2.6-3.6-5.6-3.6-9S9.6 5.6 12 3z"/></svg>
        martinbustamante.com
      </a>
    </nav>
  </div>
</main>

<footer class="pie">
  <span>© 2026 Jornada de la Cadena Láctea de Entre Ríos</span>
  <div class="orgs">

<script>
/* mismas partículas sutiles que en la sección de galería del sitio */
(function(){
  const c=document.getElementById('particulas');
  if(!c || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ctx=c.getContext('2d'); const dpr=Math.min(devicePixelRatio||1,2);
  let w=0,h=0,ps=[],raf=null;
  function medir(){
    const r=c.getBoundingClientRect(); w=r.width; h=r.height;
    c.width=w*dpr; c.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(Math.min(70,Math.max(26,w*h/16000)));
    ps=Array.from({length:n},()=>({
      x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.7+.5,
      vx:(Math.random()-.5)*.12, vy:-(Math.random()*.16+.04),
      a:Math.random()*.4+.12, t:Math.random()*6.28
    }));
  }
  function pintar(){
    ctx.clearRect(0,0,w,h);
    for(const p of ps){
      p.x+=p.vx; p.y+=p.vy; p.t+=.012;
      if(p.y<-6){ p.y=h+6; p.x=Math.random()*w; }
      if(p.x<-6) p.x=w+6; if(p.x>w+6) p.x=-6;
      const al=p.a*(.65+.35*Math.sin(p.t));
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283);
      ctx.fillStyle='rgba(115,193,239,'+al.toFixed(3)+')'; ctx.fill();
    }
    raf=requestAnimationFrame(pintar);
  }
  medir(); addEventListener('resize',medir);
  raf=requestAnimationFrame(pintar);
})();
</script>
</body>
